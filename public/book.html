<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Book</title>

  <link rel="stylesheet" href="/css/bookInside.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>


<header class="readerbar">
  <a class="back" href="/">
    <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7M5 12h14" /></svg>
    <span>Library</span>
  </a>

  <div class="readerhead">
    <h1 id="bookTitle" class="brand">Book</h1>
  </div>

  <div class="reader-actions">
    <button type="button" id="pdfBtn" aria-label="Print" title="Print">
      <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6M6 17H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M6 14h12v7H6zm12-2h1" /></svg>
      <span>Print</span>
    </button>
    <button type="button" id="settingsBtn" aria-label="Reading settings" title="Reading settings" aria-controls="settingsPanel" aria-expanded="false">
      <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h5m4 0h7M4 12h10m4 0h2M4 18h2m4 0h10" /><circle cx="11" cy="6" r="2" /><circle cx="16" cy="12" r="2" /><circle cx="8" cy="18" r="2" /></svg>
      <span>Reading settings</span>
    </button>
  </div>

<div class="settings-panel" id="settingsPanel" hidden>
  <h2>Reading level</h2>

  <div class="segmented">
    <button data-level="101" class="active">Introductory</button>
    <button data-level="201">Intermediate</button>
    <button data-level="301">Advanced</button>
  </div>

  <div class="toggle">
    <input type="checkbox" id="eqToggle" checked />
    <label for="eqToggle">Show Equations</label>
  </div>
</div>
</header>

<main class="reader">
  <nav class="sidebar" aria-label="Chapters">
    <h2 class="sidebar-title">Contents</h2>
    <button type="button" id="contentsToggle" aria-expanded="false" aria-controls="chapterNavigation">Contents</button>
    <div id="chapterNavigation">
      <input id="search" class="search" type="search" aria-label="Search chapters" placeholder="Search chapters…" />
      <div id="chapters" class="chapters"></div>
    </div>
  </nav>

  <section class="content">
    <div class="reading-page">
      <p id="breadcrumb" class="chapter-position" hidden></p>
      <article id="content" class="prose">Select a chapter.</article>
      <nav id="chapterPagination" class="chapter-pagination" aria-label="Continue reading" hidden>
        <a id="previousChapter" rel="prev" hidden><span>← Previous chapter</span><strong></strong></a>
        <a id="nextChapter" rel="next" hidden><span>Next chapter →</span><strong></strong></a>
      </nav>
    </div>
  </section>
</main>


<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="/scripts/book.js"></script>

</body>
</html>
